<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="5" stitchTiles="stitch" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" filter="url(#noise)" opacity="0.95"/>
</svg>